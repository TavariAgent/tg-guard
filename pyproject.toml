[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-guard"
version = "0.2.3.14"
description = "Lightweight, decorator-first task routing for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Tavari" }
]
keywords = [
    "async", "threading", "task-queue", "concurrency",
    "decorator", "worker-pool", "cpu-pinning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["psutil>=5.9"]

[project.urls]
Homepage    = "https://github.com/TavariAgent/tg-guard"
Repository  = "https://github.com/TavariAgent/tg-guard"
Issues      = "https://github.com/TavariAgent/tg-guard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenguard*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
[[tool.mypy.overrides]]
module = [
    "numpy.*", "pandas.*", "torch.*", "tensorflow.*",
    "jax.*", "cupy.*", "dask.*", "xarray.*", "polars.*",
    "pyarrow.*", "awkward.*", "sparse.*", "scipy.*",
    "zarr.*", "h5py.*", "numba.*", "mxnet.*", "paddle.*",
    "networkx.*", "igraph.*", "shapely.*", "geopandas.*",
    "lxml.*", "bs4.*", "sqlalchemy.*", "django.*",
    "peewee.*", "pyspark.*", "ray.*", "pygame.*",
    "pyglet.*", "PIL.*", "av.*", "setuptools.*", "Cython.*",
]
ignore_missing_imports = true