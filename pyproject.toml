[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-guard"
version = "0.1.0.3"
description = "Lightweight, decorator-first task routing for Python."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
authors = [
    { name = "Tavari" }
]
keywords = [
    "async", "threading", "task-queue", "concurrency",
    "decorator", "worker-pool", "cpu-pinning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage    = "https://github.com/TavariAgent/tg-guard"
Repository  = "https://github.com/TavariAgent/tg-guard"
Issues      = "https://github.com/TavariAgent/tg-guard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenguard*"]